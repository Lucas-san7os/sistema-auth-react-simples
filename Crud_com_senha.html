<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Genérico com Área Administrativa</title>
    
    <!-- Bibliotecas via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script> 
</head>
<body class="transition-colors duration-300 bg-slate-100" id="body-bg">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Módulo de Criptografia Simples (XOR Cipher + Base64) ---
        const SECRET_KEY = "CHAVE_ACADEMICA_SEGURA_2024";

        const simpleEncrypt = (text) => {
            if (!text) return "";
            let result = "";
            for (let i = 0; i < text.length; i++) {
                result += String.fromCharCode(text.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
            }
            return btoa(result);
        };

        const simpleDecrypt = (cipherText) => {
            if (!cipherText) return "";
            try {
                const text = atob(cipherText);
                let result = "";
                for (let i = 0; i < text.length; i++) {
                    result += String.fromCharCode(text.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
                }
                return result;
            } catch (e) { return ""; }
        };

        // --- Ícones ---
        const Icons = {
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Mail: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            ArrowRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>,
            XCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>,
            CheckSmall: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            LogIn: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Moon: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
            Shield: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            Phone: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
            Database: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>,
            AlertTriangle: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 18 18"/></svg>
        };

        function App() {
            const [currentScreen, setCurrentScreen] = useState('register');
            
            // Controle do Modal de Configurações
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [activeSettingsTab, setActiveSettingsTab] = useState('profile');

            // --- Banco de Dados Local (DB User) ---
            // Agora contém: { name, email, password, recoveryEmail }
            const [dbUser, setDbUser] = useState(null); 
            
            // Dados Extras do Perfil (Profile Data)
            const [profileData, setProfileData] = useState({
                birthdate: '',
                phone: '',
                bio: ''
            });

            // Configurações do Usuário (Preferências)
            const [userConfig, setUserConfig] = useState({
                darkMode: false,
                twoFactor: false
                // recoveryEmail removido daqui, foi para dbUser
            });
            
            // Estados para Input de Recuperação
            const [recoveryInput, setRecoveryInput] = useState('');
            const [recoveryError, setRecoveryError] = useState('');

            // --- EFEITOS (Carregar/Salvar) ---
            useEffect(() => {
                const storedData = localStorage.getItem('secure_db_user_v4'); // Chave atualizada para V4
                const storedConfig = localStorage.getItem('secure_config_v4');
                const storedProfile = localStorage.getItem('secure_profile_v4');
                
                if (storedData) {
                    try {
                        const parsed = JSON.parse(storedData);
                        setDbUser({
                            ...parsed,
                            email: simpleDecrypt(parsed.email),
                            password: simpleDecrypt(parsed.password),
                            // Descriptografando o e-mail de recuperação se existir
                            recoveryEmail: parsed.recoveryEmail ? simpleDecrypt(parsed.recoveryEmail) : ''
                        });
                    } catch (e) { console.error("Erro ao ler DB", e); }
                }

                if (storedConfig) setUserConfig(JSON.parse(storedConfig));
                if (storedProfile) setProfileData(JSON.parse(storedProfile));
            }, []);

            useEffect(() => {
                const body = document.getElementById('body-bg');
                if (userConfig.darkMode) {
                    body.classList.remove('bg-slate-100');
                    body.classList.add('bg-slate-900', 'text-white');
                } else {
                    body.classList.add('bg-slate-100');
                    body.classList.remove('bg-slate-900', 'text-white');
                }
                localStorage.setItem('secure_config_v4', JSON.stringify(userConfig));
            }, [userConfig]);

            // Salvar perfil extra quando alterado
            const saveProfileData = (newData) => {
                setProfileData(newData);
                localStorage.setItem('secure_profile_v4', JSON.stringify(newData));
                alert("Dados de perfil atualizados com sucesso!");
            };

            // --- Estados de Inputs Auth ---
            const [regName, setRegName] = useState('');
            const [regEmail, setRegEmail] = useState('');
            const [regPassword, setRegPassword] = useState('');
            
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [isValid, setIsValid] = useState(false);
            const [showSuccess, setShowSuccess] = useState(false);
            const [criteria, setCriteria] = useState({});

            // Validação de Senha
            useEffect(() => {
                const newCriteria = {
                    length: regPassword.length >= 8,
                    upper: /[A-Z]/.test(regPassword),
                    lower: /[a-z]/.test(regPassword),
                    special: /[!@#$%^&*(),.?":{}|<>]/.test(regPassword),
                    number: /\d/.test(regPassword)
                };
                setCriteria(newCriteria);
                setIsValid(Object.values(newCriteria).every(Boolean));
            }, [regPassword]);

            const handleRegisterSubmit = (e) => {
                e.preventDefault();
                if (!isValid) return;

                const newUserEncrypted = {
                    name: regName,
                    email: simpleEncrypt(regEmail),
                    password: simpleEncrypt(regPassword),
                    recoveryEmail: '' // Inicia vazio, mas criptografado seria string vazia
                };

                localStorage.setItem('secure_db_user_v4', JSON.stringify(newUserEncrypted));
                
                // Atualiza estado local (Descriptografado)
                setDbUser({ 
                    name: regName, 
                    email: regEmail, 
                    password: regPassword,
                    recoveryEmail: ''
                });

                setShowSuccess(true);
                setLoginError('');
                setTimeout(() => {
                    setShowSuccess(false);
                    setCurrentScreen('login');
                    setRegPassword('');
                }, 2000);
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                if (!dbUser) { setLoginError('Nenhum usuário cadastrado.'); return; }
                if (loginEmail === dbUser.email && loginPassword === dbUser.password) {
                    setLoginError('');
                    setCurrentScreen('dashboard');
                } else {
                    setLoginError('Credenciais inválidas.');
                }
            };

            const handleLogout = () => {
                setLoginEmail('');
                setLoginPassword('');
                setIsSettingsOpen(false); // Fecha o modal se estiver aberto
                setCurrentScreen('login');
            };

            // Helpers de Config
            const toggleTheme = () => setUserConfig(prev => ({...prev, darkMode: !prev.darkMode}));
            
            const toggle2FA = () => {
                const nextState = !userConfig.twoFactor;
                setUserConfig(prev => ({...prev, twoFactor: nextState}));
                if (nextState) {
                    setTimeout(() => {
                        alert("🔒 Autenticação de Dois Fatores (2FA) Ativada!\n\nConfirmação: Na próxima entrada será necessário fazer a identificação por e-mail ou SMS.");
                    }, 100);
                }
            };
            
            // --- NOVA LÓGICA DE E-MAIL DE RECUPERAÇÃO (SALVO NO BANCO) ---
            const handleAddRecoveryEmail = () => {
                if (!recoveryInput) return;
                
                // Validação: Não pode ser igual ao e-mail principal
                if (recoveryInput === dbUser.email) {
                    setRecoveryError('O e-mail de recuperação não pode ser igual ao principal.');
                    return;
                }
                
                if (!recoveryInput.includes('@')) {
                    setRecoveryError('E-mail inválido.');
                    return;
                }
                
                // 1. Atualizar o estado local (Descriptografado para uso na UI)
                const updatedUser = { ...dbUser, recoveryEmail: recoveryInput };
                setDbUser(updatedUser);

                // 2. Criptografar e Salvar no "Banco de Dados" (LocalStorage)
                const encryptedUser = {
                    name: updatedUser.name,
                    email: simpleEncrypt(updatedUser.email),
                    password: simpleEncrypt(updatedUser.password),
                    recoveryEmail: simpleEncrypt(updatedUser.recoveryEmail) // Criptografando
                };
                
                localStorage.setItem('secure_db_user_v4', JSON.stringify(encryptedUser));
                
                setRecoveryError('');
                alert("E-mail de recuperação salvo e criptografado no banco de dados!");
                setRecoveryInput('');
            };

            const handleRemoveRecoveryEmail = () => {
                // Remove do estado
                const updatedUser = { ...dbUser, recoveryEmail: '' };
                setDbUser(updatedUser);

                // Remove do banco (criptografado como vazio)
                const encryptedUser = {
                    name: updatedUser.name,
                    email: simpleEncrypt(updatedUser.email),
                    password: simpleEncrypt(updatedUser.password),
                    recoveryEmail: ''
                };
                localStorage.setItem('secure_db_user_v4', JSON.stringify(encryptedUser));
            };

            const PasswordRequirement = ({ met, text }) => (
                <div className={`flex items-center gap-2 text-xs transition-colors duration-300 ${met ? 'text-green-600' : 'text-slate-400'}`}>
                    {met ? <Icons.CheckSmall /> : <Icons.XCircle />}
                    <span>{text}</span>
                </div>
            );

            // --- CLASSES CSS DINÂMICAS ---
            const textClass = userConfig.darkMode ? 'text-white' : 'text-slate-800';
            const bgCard = userConfig.darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200';
            const inputClass = userConfig.darkMode 
                ? 'bg-slate-700 border-slate-600 text-white focus:ring-blue-500' 
                : 'bg-white border-gray-300 text-gray-900 focus:ring-blue-500';

            // --- TELA DO "SITE GENÉRICO" (DASHBOARD) ---
            if (currentScreen === 'dashboard') {
                return (
                    <div className={`min-h-screen relative font-sans ${textClass}`}>
                        
                        <div className="absolute top-6 left-6 z-50">
                            <button 
                                onClick={() => setIsSettingsOpen(true)}
                                className={`p-3 rounded-full shadow-lg transition-transform hover:scale-110 flex items-center gap-2 ${userConfig.darkMode ? 'bg-blue-600 text-white' : 'bg-white text-slate-800 hover:bg-slate-50'}`}
                            >
                                <Icons.Settings className="animate-spin-slow" />
                                <span className="text-xs font-bold hidden md:inline">Config</span>
                            </button>
                        </div>

                        <nav className={`shadow-sm px-6 py-4 flex justify-end items-center ${userConfig.darkMode ? 'bg-slate-900/50' : 'bg-white/80'} backdrop-blur-md sticky top-0 z-40`}>
                            <div className="flex items-center gap-6">
                                <a href="#" className="hover:text-blue-500 transition-colors">Produtos</a>
                                <a href="#" className="hover:text-blue-500 transition-colors">Sobre</a>
                                <button onClick={handleLogout} className="flex items-center gap-2 text-red-500 font-medium hover:bg-red-500/10 px-3 py-1 rounded-lg transition-colors">
                                    <Icons.LogOut size={18} /> Sair
                                </button>
                            </div>
                        </nav>

                        <main className="max-w-5xl mx-auto p-8 mt-10">
                            <div className="text-center space-y-6 mb-16">
                                <h1 className="text-5xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-purple-600">
                                    Bem-vindo ao Futuro
                                </h1>
                                <p className={`text-xl max-w-2xl mx-auto ${userConfig.darkMode ? 'text-slate-400' : 'text-slate-600'}`}>
                                    Olá, <strong>{dbUser?.name}</strong>. Esta é a área exclusiva para membros da nossa plataforma fictícia. Explore nossos recursos de inovação.
                                </p>
                                <div className="flex justify-center gap-4">
                                    <button className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-bold shadow-lg shadow-blue-500/30 transition-all">
                                        Começar Agora
                                    </button>
                                    <button className={`px-8 py-3 rounded-lg font-bold border transition-all ${userConfig.darkMode ? 'border-slate-600 hover:bg-slate-800' : 'border-slate-300 hover:bg-slate-100'}`}>
                                        Saiba Mais
                                    </button>
                                </div>
                            </div>

                            <div className="grid md:grid-cols-3 gap-6">
                                <div className={`p-6 rounded-xl border ${bgCard} hover:border-blue-500 transition-colors cursor-pointer group`}>
                                    <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center mb-4 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                        <Icons.Database />
                                    </div>
                                    <h3 className="text-xl font-bold mb-2">Cloud Data</h3>
                                    <p className="opacity-70 text-sm">Armazenamento escalável para seus projetos enterprise.</p>
                                </div>
                                <div className={`p-6 rounded-xl border ${bgCard} hover:border-purple-500 transition-colors cursor-pointer group`}>
                                    <div className="w-12 h-12 bg-purple-100 text-purple-600 rounded-lg flex items-center justify-center mb-4 group-hover:bg-purple-600 group-hover:text-white transition-colors">
                                        <Icons.Shield />
                                    </div>
                                    <h3 className="text-xl font-bold mb-2">Segurança Total</h3>
                                    <p className="opacity-70 text-sm">Proteção ponta a ponta com criptografia de última geração.</p>
                                </div>
                                <div className={`p-6 rounded-xl border ${bgCard} hover:border-green-500 transition-colors cursor-pointer group`}>
                                    <div className="w-12 h-12 bg-green-100 text-green-600 rounded-lg flex items-center justify-center mb-4 group-hover:bg-green-600 group-hover:text-white transition-colors">
                                        <Icons.CheckCircle />
                                    </div>
                                    <h3 className="text-xl font-bold mb-2">Alta Performance</h3>
                                    <p className="opacity-70 text-sm">Otimização de recursos para máxima velocidade.</p>
                                </div>
                            </div>
                        </main>

                        {isSettingsOpen && (
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className={`w-full max-w-4xl h-[80vh] rounded-2xl shadow-2xl flex overflow-hidden border ${bgCard} border-slate-600`}>
                                    
                                    <aside className={`w-64 p-6 flex flex-col gap-2 border-r ${userConfig.darkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                                        <h2 className="text-xl font-bold mb-6 flex items-center gap-2">
                                            <Icons.Settings className="text-blue-500" /> Ajustes
                                        </h2>
                                        
                                        <button 
                                            onClick={() => setActiveSettingsTab('profile')}
                                            className={`text-left px-4 py-3 rounded-lg flex items-center gap-3 transition-colors ${activeSettingsTab === 'profile' ? 'bg-blue-600 text-white' : 'hover:bg-slate-500/10'}`}
                                        >
                                            <Icons.User size={18} /> Meu Perfil
                                        </button>
                                        <button 
                                            onClick={() => setActiveSettingsTab('security')}
                                            className={`text-left px-4 py-3 rounded-lg flex items-center gap-3 transition-colors ${activeSettingsTab === 'security' ? 'bg-blue-600 text-white' : 'hover:bg-slate-500/10'}`}
                                        >
                                            <Icons.Shield size={18} /> Segurança
                                        </button>
                                        
                                        <div className="mt-auto pt-4 border-t border-slate-500/20">
                                            <button 
                                                onClick={() => setActiveSettingsTab('debug')}
                                                className={`w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 transition-colors ${activeSettingsTab === 'debug' ? 'bg-red-500/10 text-red-500 border border-red-500/20' : 'text-slate-500 hover:text-red-500'}`}
                                            >
                                                <Icons.Database size={18} /> Dados do Sistema
                                            </button>
                                        </div>
                                    </aside>

                                    <div className="flex-1 p-8 overflow-y-auto relative">
                                        <button onClick={() => setIsSettingsOpen(false)} className="absolute top-4 right-4 p-2 hover:bg-slate-500/10 rounded-full">
                                            <Icons.X />
                                        </button>

                                        {activeSettingsTab === 'profile' && (
                                            <div className="space-y-6">
                                                <h3 className="text-2xl font-bold border-b pb-4 border-slate-500/20">Editar Perfil</h3>
                                                
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2 opacity-70">Nome Completo</label>
                                                        <div className={`flex items-center gap-2 p-3 border rounded-lg opacity-60 cursor-not-allowed ${bgCard}`}>
                                                            <Icons.User size={18} />
                                                            <span>{dbUser?.name}</span>
                                                            <span className="text-xs ml-auto">(Fixo)</span>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2 opacity-70">E-mail</label>
                                                        <div className={`flex items-center gap-2 p-3 border rounded-lg opacity-60 cursor-not-allowed ${bgCard}`}>
                                                            <Icons.Mail size={18} />
                                                            <span>{dbUser?.email}</span>
                                                            <span className="text-xs ml-auto">(Fixo)</span>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2">Data de Nascimento</label>
                                                        <div className="relative">
                                                            <span className="absolute left-3 top-3 opacity-50"><Icons.Calendar size={18}/></span>
                                                            <input 
                                                                type="date" 
                                                                value={profileData.birthdate} 
                                                                onChange={(e) => setProfileData({...profileData, birthdate: e.target.value})}
                                                                className={`w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 ${inputClass}`} 
                                                            />
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2">Telefone</label>
                                                        <div className="relative">
                                                            <span className="absolute left-3 top-3 opacity-50"><Icons.Phone size={18}/></span>
                                                            <input 
                                                                type="tel" 
                                                                placeholder="(00) 00000-0000"
                                                                value={profileData.phone} 
                                                                onChange={(e) => setProfileData({...profileData, phone: e.target.value})}
                                                                className={`w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 ${inputClass}`} 
                                                            />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="block text-sm font-medium mb-2">Biografia</label>
                                                    <textarea 
                                                        rows="3"
                                                        placeholder="Fale um pouco sobre você..."
                                                        value={profileData.bio}
                                                        onChange={(e) => setProfileData({...profileData, bio: e.target.value})}
                                                        className={`w-full p-4 border rounded-lg focus:outline-none focus:ring-2 ${inputClass}`}
                                                    ></textarea>
                                                </div>

                                                <div className="pt-4 flex justify-end">
                                                    <button onClick={() => saveProfileData(profileData)} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold">
                                                        Salvar Alterações
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        {activeSettingsTab === 'security' && (
                                            <div className="space-y-6">
                                                <h3 className="text-2xl font-bold border-b pb-4 border-slate-500/20">Configurações de Segurança</h3>
                                                
                                                <div className={`p-4 rounded-xl border flex items-center justify-between ${bgCard}`}>
                                                    <div className="flex items-center gap-4">
                                                        <div className="p-2 bg-green-100 text-green-600 rounded-lg"><Icons.Shield /></div>
                                                        <div>
                                                            <p className="font-bold">Autenticação de Dois Fatores (2FA)</p>
                                                            <p className="text-sm opacity-60">Segurança adicional no login</p>
                                                        </div>
                                                    </div>
                                                    <button onClick={toggle2FA} className={`w-12 h-6 rounded-full p-1 transition-colors ${userConfig.twoFactor ? 'bg-green-600' : 'bg-slate-300'}`}>
                                                        <div className={`w-4 h-4 bg-white rounded-full shadow-md transform transition-transform ${userConfig.twoFactor ? 'translate-x-6' : ''}`}></div>
                                                    </button>
                                                </div>

                                                <div className={`p-4 rounded-xl border ${bgCard}`}>
                                                    <div className="flex items-center gap-4 mb-3">
                                                        <div className="p-2 bg-blue-100 text-blue-600 rounded-lg"><Icons.Mail /></div>
                                                        <div>
                                                            <p className="font-bold">E-mail de Recuperação</p>
                                                            <p className="text-sm opacity-60">Para redefinir sua senha caso a esqueça</p>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="flex gap-2">
                                                        <input 
                                                            type="email" 
                                                            value={dbUser?.recoveryEmail || recoveryInput}
                                                            onChange={(e) => setRecoveryInput(e.target.value)}
                                                            disabled={!!dbUser?.recoveryEmail}
                                                            placeholder="exemplo@recuperacao.com"
                                                            className={`flex-1 px-3 py-2 rounded border ${inputClass} ${!!dbUser?.recoveryEmail ? 'opacity-50 cursor-not-allowed' : ''}`}
                                                        />
                                                        {!dbUser?.recoveryEmail && (
                                                            <button onClick={handleAddRecoveryEmail} className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-bold text-sm">
                                                                Salvar
                                                            </button>
                                                        )}
                                                        {dbUser?.recoveryEmail && (
                                                             <button onClick={handleRemoveRecoveryEmail} className="text-red-500 hover:bg-red-50 px-3 py-2 rounded text-sm font-bold">
                                                                Remover
                                                            </button>
                                                        )}
                                                    </div>
                                                    {recoveryError && <p className="text-red-500 text-xs mt-2 font-bold">{recoveryError}</p>}
                                                    {dbUser?.recoveryEmail && <p className="text-green-500 text-xs mt-2 flex items-center gap-1 font-bold"><Icons.CheckSmall/> Protegido & Salvo no DB</p>}
                                                </div>
                                            </div>
                                        )}

                                        {activeSettingsTab === 'debug' && (
                                            <div className="space-y-6">
                                                <h3 className="text-2xl font-bold border-b pb-4 border-slate-500/20 text-red-500 flex items-center gap-2">
                                                    <Icons.AlertTriangle /> Dados do Sistema
                                                </h3>
                                                
                                                <div className="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded mb-6">
                                                    <p className="font-bold text-sm uppercase mb-1">Aviso Educacional</p>
                                                    <p className="text-sm">
                                                        Esta tela demonstra como os dados (incluindo o e-mail de recuperação) estão sendo criptografados e salvos no Banco de Dados (LocalStorage).
                                                    </p>
                                                </div>

                                                <div className="space-y-4">
                                                    <div className={`p-4 rounded-lg border border-slate-500/20 bg-slate-500/5`}>
                                                        <p className="text-sm font-bold uppercase opacity-50 mb-2">Dados Criptografados (LocalStorage)</p>
                                                        <code className="block p-4 bg-black/90 text-green-400 rounded-lg text-xs font-mono break-all leading-relaxed shadow-inner">
                                                            <span className="text-purple-400">const</span> dbUser = &#123;<br/>
                                                            &nbsp;&nbsp;<span className="text-blue-300">"email"</span>: <span className="text-yellow-300">"{simpleEncrypt(dbUser?.email)}"</span>,<br/>
                                                            &nbsp;&nbsp;<span className="text-blue-300">"password"</span>: <span className="text-yellow-300">"{simpleEncrypt(dbUser?.password)}"</span>,<br/>
                                                            &nbsp;&nbsp;<span className="text-blue-300">"recoveryEmail"</span>: <span className="text-yellow-300">"{simpleEncrypt(dbUser?.recoveryEmail)}"</span>,<br/>
                                                            &nbsp;&nbsp;<span className="text-blue-300">"name"</span>: "{dbUser?.name}"<br/>
                                                            &#125;
                                                        </code>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            const authCardClass = userConfig.darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200 text-slate-800';
            
            return (
                <div className={`min-h-screen flex items-center justify-center p-4 transition-colors duration-300 ${userConfig.darkMode ? 'bg-slate-900' : 'bg-slate-100'}`}>
                    <div className={`w-full max-w-md rounded-2xl shadow-xl overflow-hidden ${authCardClass}`}>
                        <div className="bg-slate-800 p-6 text-center">
                            <h1 className="text-2xl font-bold text-white">
                                {currentScreen === 'register' ? 'Criar Conta Segura' : 'Acessar Sistema'}
                            </h1>
                            <div className="flex justify-center mt-2 text-slate-400 text-xs gap-4">
                                <span className="flex items-center gap-1"><Icons.Database size={12}/> DB Criptografado</span>
                            </div>
                        </div>

                        <div className="p-8">
                            {showSuccess && (
                                <div className="mb-6 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative flex items-center gap-2 animate-pulse">
                                    <Icons.CheckCircle /><span>Usuário cadastrado!</span>
                                </div>
                            )}

                            {loginError && currentScreen === 'login' && (
                                <div className="mb-6 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative flex items-center gap-2 animate-pulse">
                                    <Icons.AlertTriangle /><span>{loginError}</span>
                                </div>
                            )}

                            {currentScreen === 'register' && (
                                <form onSubmit={handleRegisterSubmit} className="space-y-4">
                                    <div className="relative"><span className="absolute left-3 top-3 text-gray-400"><Icons.User/></span><input type="text" placeholder="Nome" required value={regName} onChange={(e) => setRegName(e.target.value)} className={`w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 ${inputClass}`} /></div>
                                    <div className="relative"><span className="absolute left-3 top-3 text-gray-400"><Icons.Mail/></span><input type="email" placeholder="Email" required value={regEmail} onChange={(e) => setRegEmail(e.target.value)} className={`w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 ${inputClass}`} /></div>
                                    <div className="relative"><span className="absolute left-3 top-3 text-gray-400"><Icons.Lock/></span><input type="password" placeholder="Mínimo 8 caracteres" value={regPassword} onChange={(e) => setRegPassword(e.target.value)} className={`w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 ${inputClass} ${isValid ? 'border-green-500' : ''}`} /></div>
                                    <div className={`p-3 rounded-lg space-y-2 border ${userConfig.darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-50 border-slate-200'}`}>
                                        <PasswordRequirement met={criteria.length} text="Mínimo 8 caracteres" />
                                        <PasswordRequirement met={criteria.upper} text="Letra Maiúscula" />
                                        <PasswordRequirement met={criteria.number} text="Número" />
                                        <PasswordRequirement met={criteria.special} text="Caractere Especial" />
                                    </div>
                                    <button type="submit" disabled={!isValid} className={`w-full font-bold py-3 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 mt-4 shadow-md ${isValid ? 'bg-green-600 hover:bg-green-700 text-white cursor-pointer' : 'bg-gray-400 text-gray-200 cursor-not-allowed'}`}>Cadastrar <Icons.ArrowRight /></button>
                                    <div className="text-center mt-4"><button type="button" onClick={() => setCurrentScreen('login')} className="text-sm opacity-70 hover:opacity-100 hover:text-blue-500 underline">Já tem conta? Faça Login</button></div>
                                </form>
                            )}

                            {currentScreen === 'login' && (
                                <form onSubmit={handleLoginSubmit} className="space-y-4">
                                    <div className="relative"><span className="absolute left-3 top-3 text-gray-400"><Icons.Mail/></span><input type="email" placeholder="Email" required value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} className={`w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 ${inputClass}`} /></div>
                                    <div className="relative"><span className="absolute left-3 top-3 text-gray-400"><Icons.Lock/></span><input type="password" placeholder="Senha" required value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} className={`w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 ${inputClass}`} /></div>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-md flex justify-center items-center gap-2">Entrar <Icons.LogIn /></button>
                                    <div className="text-center mt-4"><button type="button" onClick={() => setCurrentScreen('register')} className="text-sm opacity-70 hover:opacity-100 hover:text-green-500 underline">Não tem conta? Cadastre-se</button></div>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
